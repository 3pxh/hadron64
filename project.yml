name: Hadron64
options:
  bundleIdPrefix: com.hoqqanen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Hadron64:
    type: application
    platform: iOS
    sources: [Hadron64]
    info:
      path: Hadron64/Info.plist
      properties:
        CFBundleDisplayName: Hadron 64
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIRequiresFullScreen: true
        # Needed once Game Center friends are enabled (see docs/GAMECENTER.md).
        NSGKFriendListUsageDescription: See how your friends' times compare to yours.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoqqanen.hadron64
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  Hadron64Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Hadron64Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Hadron64
schemes:
  Hadron64:
    build:
      targets:
        Hadron64: all
    test:
      targets: [Hadron64Tests]
