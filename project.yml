name: Hadron64
options:
  bundleIdPrefix: com.hoqqanen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Hadron64:
    type: application
    platform: iOS
    sources:
      - Hadron64
      # Game Center leaderboards, achievements, challenges and activities; edit in Xcode's GameKit editor.
      - path: Hadron64.gamekit
        type: file
        buildPhase: resources
    info:
      path: Hadron64/Info.plist
      properties:
        CFBundleDisplayName: Hadron 64
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIRequiresFullScreen: true
        # Needed once Game Center friends are enabled (see docs/GAMECENTER.md).
        NSGKFriendListUsageDescription: See how your friends' times compare to yours.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoqqanen.hadron64
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  Hadron64Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Hadron64Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Hadron64
schemes:
  Hadron64:
    build:
      targets:
        Hadron64: all
    run:
      # Local StoreKit testing for the supporter unlock; the real product lives in App Store Connect.
      storeKitConfiguration: StoreKit/Hadron64.storekit
    test:
      targets: [Hadron64Tests]
